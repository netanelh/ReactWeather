plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'vortex-client' }

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def props = [version: project.version, minecraft_version: project.minecraft_version, loader_version: project.loader_version]
	inputs.properties props
	filesMatching("fabric.mod.json") { expand props }
}

tasks.withType(JavaCompile).configureEach { it.options.encoding = 'UTF-8' }

java {
	toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

// ./gradlew installToModrinth  -> builds and copies the jar into the 26.2 Modrinth profile
tasks.register('installToModrinth', Copy) {
	dependsOn 'build'
	from(tasks.named('jar'))
	into(System.getenv('APPDATA') + '/ModrinthApp/profiles/Fabulously Optimized (2)/mods')
}
