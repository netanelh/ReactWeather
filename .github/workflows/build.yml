name: lyrics-mod-build
on:
  push:
    branches: [lyrics-mod]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        id: build
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
      - name: publish result to lyrics-mod-ci branch
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p /tmp/out
          cp build.log /tmp/out/
          echo "${{ steps.build.outcome }} $SHA" > /tmp/out/STATUS
          for f in build/libs/*.jar; do case "$f" in *-sources.jar) ;; *) [ -f "$f" ] && cp "$f" /tmp/out/lyrics-plus.jar;; esac; done
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan lyrics-mod-ci && git rm -rf . -q
          cp /tmp/out/* . && git add -A && git commit -q -m "CI $SHA ${{ steps.build.outcome }}"
          git push -f origin lyrics-mod-ci
