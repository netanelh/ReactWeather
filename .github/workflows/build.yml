name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        id: build
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: publish result to ci-output branch
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p /tmp/out
          cp build.log /tmp/out/ || true
          echo "${{ steps.build.outcome }} $SHA" > /tmp/out/STATUS
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          rm -f /tmp/out/*-sources.jar
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-output
          git rm -rf . -q
          cp /tmp/out/* .
          git add -A
          git commit -q -m "CI $SHA: ${{ steps.build.outcome }}"
          git push -f origin ci-output
      - name: upload jar
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-plus
          path: build/libs/
      - name: fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
