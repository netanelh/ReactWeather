name: lyrics-mod-build
on:
  push:
    branches: [lyrics-mod]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        id: build
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
      - name: inspect minecraft classes
        continue-on-error: true
        run: |
          JAR=$(find ~/.gradle/caches .gradle -name "minecraft-*.jar" 2>/dev/null | grep -v sources | head -5 | tr '\n' ' ')
          echo "JARS: $JAR" > mc-api.txt
          for j in $JAR; do for c in 'net.minecraft.world.entity.Display' 'net.minecraft.world.entity.Display$TextDisplay' 'net.minecraft.client.multiplayer.ClientLevel' 'com.mojang.math.Transformation' 'net.minecraft.util.Brightness' 'net.minecraft.client.gui.screens.Screen' 'net.minecraft.client.gui.components.events.GuiEventListener' 'net.minecraft.client.gui.components.events.ContainerEventHandler' 'net.minecraft.client.input.MouseButtonEvent' 'net.minecraft.client.input.MouseButtonInfo' 'net.minecraft.client.gui.GuiGraphicsExtractor' 'net.minecraft.client.gui.Font' 'net.minecraft.network.chat.Style' 'net.minecraft.network.chat.FontDescription' 'net.minecraft.network.chat.FontDescription$Resource' 'net.minecraft.client.renderer.texture.DynamicTexture' 'net.minecraft.client.renderer.texture.TextureManager' 'com.mojang.blaze3d.platform.NativeImage'; do javap -p -cp "$j" "$c" >> mc-api.txt 2>/dev/null; done; done
      - name: publish result to lyrics-mod-ci branch
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p /tmp/out
          cp build.log mc-api.txt /tmp/out/ 2>/dev/null || cp build.log /tmp/out/
          echo "${{ steps.build.outcome }} $SHA" > /tmp/out/STATUS
          for f in build/libs/*.jar; do case "$f" in *-sources.jar) ;; *) [ -f "$f" ] && cp "$f" /tmp/out/lyrics-plus.jar;; esac; done
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan lyrics-mod-ci && git rm -rf . -q
          cp /tmp/out/* . && git add -A && git commit -q -m "CI $SHA ${{ steps.build.outcome }}"
          git push -f origin lyrics-mod-ci
