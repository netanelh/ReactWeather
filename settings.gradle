pluginManagement {
	repositories {
		maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
		mavenCentral()
		// fallback mirror of Maven Central (CI builds failed when Central returned 404s)
		maven { name = 'CentralMirror'; url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
		gradlePluginPortal()
	}
}
plugins {
	// downloads a JDK 25 automatically if this PC only has a JRE
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'vortex-client'
